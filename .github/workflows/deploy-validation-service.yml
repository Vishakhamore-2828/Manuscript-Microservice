name: Build and Deploy Validation Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Continuous Integration (Build & Run Unit Tests)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        working-directory: validation_service
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: validation_service
        run: ./gradlew test

      - name: Build Spring Boot Executable JAR
        working-directory: validation_service
        run: ./gradlew bootJar -x test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-service-jar
          path: validation_service/build/libs/validation-service-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------
  # Job 2: Continuous Deployment (Deploy to EC2 via AWS SSM)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to EC2 (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: validation-service-jar
          path: build/libs/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: arn:aws:iam::206465504931:role/GitHubActions-Manuscript-Microservice-Deploy
          role-skip-session-tagging: true 
          aws-region: ap-south-1
      - name: Upload JAR to S3 Deployment Bucket
        env:
          DEPLOY_BUCKET: ${{ secrets.DEPLOYMENT_S3_BUCKET || 'book-platform-files-206465504931-ap-south-1-an' }}
        run: |
          aws s3 cp build/libs/validation-service-0.0.1-SNAPSHOT.jar \
            s3://${DEPLOY_BUCKET}/deployments/validation-service/validation-service-0.0.1-SNAPSHOT.jar

      - name: Execute Remote Deployment on EC2 via AWS Systems Manager (SSM)
        id: ssm_deploy
        env:
          DEPLOY_BUCKET: ${{ secrets.DEPLOYMENT_S3_BUCKET || 'book-platform-files-206465504931-ap-south-1-an' }}
          TARGET_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || 'i-0968a76162e55d86b' }}
        run: |
          echo "=== Dispatching SSM Command to EC2 Instance: ${TARGET_INSTANCE_ID} ==="
          
          # Create parameter JSON file
          cat << 'EOF' > ssm-params.json
          {
            "commands": [
              "set -e",
              "echo '=== [1/4] Pulling updated JAR from S3 ==='",
              "aws s3 cp s3://book-platform-files-206465504931-ap-south-1-an/deployments/validation-service/validation-service-0.0.1-SNAPSHOT.jar /opt/book-platform/validation-service/validation-service-0.0.1-SNAPSHOT.jar",
              "sudo chown ubuntu:ubuntu /opt/book-platform/validation-service/validation-service-0.0.1-SNAPSHOT.jar",
              "echo '=== [2/4] Restarting systemd service ==='",
              "sudo systemctl restart validation-service.service",
              "echo '=== [3/4] Awaiting service initialization ==='",
              "sleep 8",
              "echo '=== [4/4] Verifying active service status ==='",
              "sudo systemctl is-active --quiet validation-service.service && echo 'SUCCESS: validation-service is active and running!' || (echo 'ERROR: validation-service failed to start' && sudo journalctl -u validation-service.service -n 50 --no-pager && exit 1)"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${TARGET_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --comment "Deploy Validation Service via GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM Command ID: $COMMAND_ID"

          # Poll status until execution concludes
          status="Pending"
          while [ "$status" = "Pending" ] || [ "$status" = "InProgress" ] || [ "$status" = "Delayed" ]; do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${TARGET_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Deployment execution status: $status"
          done

          if [ "$status" != "Success" ]; then
            echo "::error::SSM Command failed with status: $status"
            echo "--- Standard Output ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${TARGET_INSTANCE_ID}" \
              --query "StandardOutputContent" \
              --output text
            echo "--- Standard Error ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${TARGET_INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "=== Deployment Successfully Completed! ==="